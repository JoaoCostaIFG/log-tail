name: Build daily edition of the volume

on:
  schedule:
    - cron: "23 8 * * *"
      timezone: 'Europe/Lisbon'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous editions
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin site >/dev/null 2>&1; then
            git fetch --depth=1 origin site
            git archive origin/site | tar -x -C site
          fi

      - name: Build edition
        run: python build.py

      - name: Publish archives to the site branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd site
          git init -q -b site
          git add .
          git commit -qm "Edition $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
